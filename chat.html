<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100e17"><title>Rchat 3.0 — Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap" rel="stylesheet"><style>:root{--bg:#100e17;--s1:#181522;--s2:#231f32;--line:#2f2a42;--tx:#f4f1fb;--mu:#a7a1bc;--pri:#6d5ef7;--pri2:#8a7dff;--sun:#ffc15e;--ok:#5fd8a4;--err:#ff8585;--sh:0 24px 60px -24px rgba(0,0,0,.7);--d:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f5f3fa;--s1:#fff;--s2:#efecf7;--line:#ddd8ec;--tx:#1a1730;--mu:#625c78;--pri:#5443e8;--pri2:#4332d0;--sun:#c77d00;--ok:#16895c;--err:#c22f2f;--sh:0 24px 50px -28px rgba(40,30,90,.35)}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html{color-scheme:dark light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--d);margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 max(20px,calc((100% - 1160px)/2));background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font:800 27px var(--d);letter-spacing:-.045em}
.logo span{font-weight:500;color:var(--mu)}
.logo:after{content:"";display:inline-block;width:8px;height:8px;margin-left:3px;border-radius:50%;background:var(--sun)}
nav{display:flex;gap:4px}
nav a{padding:8px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mu);transition:background .15s,color .15s}
nav a:hover{color:var(--tx);background:var(--s2)}
main{width:min(1160px,calc(100% - 40px));margin:0 auto;padding:48px 0 64px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:#fff;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--pri2)}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:not-allowed}
.tiny,.btn.alt,#signup,#clear{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.tiny:hover,.btn.alt:hover,#signup:hover,#clear:hover{background:var(--s2)}
.tiny{padding:6px 12px;font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;padding:13px 24px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;transition:background .15s}
.btn:hover{background:var(--pri2)}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:0;border-color:var(--pri2);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
::placeholder{color:var(--mu);opacity:.75}
label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--mu)}
.muted,.note{color:var(--mu)}
.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--s2);color:var(--sun);font:800 17px var(--d)}
footer{width:min(1160px,calc(100% - 40px));margin:0 auto;padding:22px 0 40px;border-top:1px solid var(--line);color:var(--mu);font-size:13px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:600px){header{height:60px}.logo{font-size:23px}nav a{padding:7px 10px;font-size:13px}main{padding:28px 0 48px}}
#auth{width:min(460px,calc(100% - 32px));margin:8vh auto;padding:36px;border:1px solid var(--line);border-radius:26px;background:var(--s1);box-shadow:var(--sh)}
#auth h1{margin-bottom:8px;font-size:36px;line-height:1.05;letter-spacing:-.04em}
#auth p{margin:0}.authrow{display:flex;gap:10px;margin-top:22px}.authrow button{flex:1}
#authError{min-height:1.4em;margin-top:14px;color:var(--err);font-size:14px}
#app{display:none;gap:16px;width:min(1280px,calc(100% - 32px));height:calc(100dvh - 100px);min-height:520px;margin:16px auto}
.sidebar{display:flex;flex:0 0 264px;flex-direction:column;padding:18px;overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--s1)}
.side-title{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--mu)}
.sidebar>.side-title:first-child{margin-top:0}
#channels,#members{display:flex;flex-direction:column;gap:2px}#members{max-height:30vh;overflow:auto}
.channel{width:100%;padding:9px 12px;border-radius:10px;background:transparent;color:var(--mu);font-size:15px;font-weight:600;text-align:left}
.channel:hover{background:var(--s2);color:var(--tx)}
.channel.active{background:color-mix(in srgb,var(--pri) 22%,transparent);color:var(--tx)}
.member{display:flex;align-items:center;gap:10px;padding:5px 4px;font-size:14px;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.member.me{color:var(--tx);font-weight:600}.member.me .dot{background:var(--ok)}
#profilePanel{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
#profilePanel .side-title{margin-top:0}#profilePanel button{width:100%;margin-top:8px}
.mainchat{display:flex;flex:1;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--s1)}
.chathead{padding:16px 22px;border-bottom:1px solid var(--line)}
#channelTitle{font:700 20px var(--d);letter-spacing:-.02em}#channelDescription{font-size:13px}
#messages{display:flex;flex:1;flex-direction:column;padding:10px;overflow:auto}
.msg{display:grid;grid-template-columns:40px 1fr;column-gap:12px;padding:10px 12px;border-radius:12px}
.msg:hover{background:var(--s2)}.msg>*{grid-column:2}.msg>.avatar{grid-column:1;grid-row:1/4}
.msg.mine .avatar{background:var(--pri);color:#fff}
.msghead{display:flex;align-items:baseline;gap:10px}.username{font-weight:700}.msg.mine .username{color:var(--pri2)}
.time{font-size:12px;color:var(--mu)}
.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.deleted .content{font-style:italic;color:var(--mu)}
.msgtools{display:flex;gap:6px;margin-top:6px;opacity:0;transition:opacity .15s}
.msg:hover .msgtools,.msg:focus-within .msgtools{opacity:1}
@media(hover:none){.msgtools{opacity:1}}
.empty{margin:auto;padding:24px;text-align:center;color:var(--mu)}
#composer{display:flex;gap:10px;align-items:flex-end;padding:14px;border-top:1px solid var(--line)}
#messageInput{min-height:48px;max-height:140px;resize:none}#composer button{height:48px}
#toast{display:none;position:fixed;left:50%;bottom:24px;z-index:50;transform:translateX(-50%);padding:11px 18px;border-radius:12px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--sh)}
@media(max-width:800px){#app{flex-direction:column;height:calc(100dvh - 84px);margin:12px auto}.sidebar{flex:0 0 auto;max-height:36vh;padding:14px}#channels{flex-direction:row;flex-wrap:wrap}.channel{width:auto}.mainchat{min-height:0}}
</style></head>
<body class="chat">
<header><a class="logo" href="index.html">R<span>chat</span></a><nav><a href="index.html">Accueil</a><a href="defis.html">Défis</a><a href="ia.html">IA</a></nav></header>
<section id="auth">
<h1>Bienvenue sur Rchat</h1><p class="muted">Connecte-toi ou crée ton compte.</p>
<label>Pseudo (à remplir uniquement pour l'inscription)</label><input id="username" maxlength="24" placeholder="Ton pseudo">
<label>Adresse e-mail</label><input id="email" type="email" autocomplete="email" placeholder="nom@exemple.fr">
<label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe">
<div class="authrow"><button id="login">Connexion</button><button id="signup">Créer un compte</button></div>
<p><button id="reset" class="tiny">Mot de passe oublié</button></p><p id="authError" class="muted"></p>
</section>
<div id="app">
<aside class="sidebar">
<div class="side-title">Salons</div><div id="channels"></div>
<div class="side-title">Membres</div><div id="members"></div>
<div id="profilePanel"><div class="side-title">Mon profil</div><input id="bio" maxlength="180" placeholder="Ta bio"><button id="saveProfile">Enregistrer</button><button id="logout" class="tiny" style="margin-top:8px">Déconnexion</button></div>
</aside>
<section class="mainchat">
<div class="chathead"><strong id="channelTitle"># général</strong><div class="muted" id="channelDescription"></div></div>
<div id="messages"></div>
<form id="composer"><textarea id="messageInput" maxlength="3000" placeholder="Écris un message…"></textarea><button>Envoyer</button></form>
</section>
</div><div id="toast"></div>
<script>
const SUPABASE_URL="https://iqqllfcwdisomsyypeuu.supabase.co";
const SUPABASE_KEY="sb_publishable_XE9etqdqqg7BmLronBNgTw_1tkHblfk";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let user=null,profile=null,channel=null,channels=[],subscription=null,profiles={};
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").style.display="none",3000)}
function esc(s){return String(s??"")}
async function authAction(mode){
 $("authError").textContent="";
 const email=$("email").value.trim(),password=$("password").value,username=$("username").value.trim();
 if(!email||!password){$("authError").textContent="Renseigne ton e-mail et ton mot de passe.";return}
 let result;
 if(mode==="signup"){
  if(username.length<3){$("authError").textContent="Le pseudo doit contenir au moins 3 caractères.";return}
  result=await db.auth.signUp({email,password,options:{data:{username}}});
 }else result=await db.auth.signInWithPassword({email,password});
 if(result.error){$("authError").textContent=result.error.message;return}
 if(mode==="signup"&&!result.data.session){$("authError").textContent="Compte créé. Vérifie ton e-mail pour confirmer l'inscription.";return}
 if(result.data.session)start(result.data.session.user);
}
$("login").onclick=()=>authAction("login");$("signup").onclick=()=>authAction("signup");
$("reset").onclick=async()=>{const email=$("email").value.trim();if(!email)return toast("Entre d'abord ton adresse e-mail.");const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});toast(error?error.message:"E-mail de réinitialisation envoyé si le compte existe.")};
$("logout").onclick=()=>db.auth.signOut();
async function start(u){
 user=u;$("auth").style.display="none";$("app").style.display="flex";
 await loadProfile();await loadChannels();await loadMembers();
 db.channel("rchat3-chat-live").on("postgres_changes",{event:"*",schema:"public",table:"rchat3_messages",filter:channel?"channel_id=eq."+channel.id:undefined},loadMessages).subscribe();
}
async function loadProfile(){
 const {data,error}=await db.from("rchat3_profiles").select("*").eq("id",user.id).maybeSingle();
 if(error){toast("Profil : "+error.message);return}
 profile=data;$("bio").value=data?.bio||"";
}
$("saveProfile").onclick=async()=>{const {error}=await db.from("rchat3_profiles").update({bio:$("bio").value.trim(),updated_at:new Date().toISOString()}).eq("id",user.id);toast(error?error.message:"Profil enregistré.")};
async function loadChannels(){
 const {data,error}=await db.from("rchat3_channels").select("*").order("created_at");
 if(error){toast("Salons : "+error.message);return}
 channels=data||[];const box=$("channels");box.replaceChildren();
 channels.forEach(c=>{const b=document.createElement("button");b.className="channel"+(channel?.id===c.id?" active":"");b.textContent="# "+c.name;b.onclick=()=>selectChannel(c);box.append(b)});
 if(!channel&&channels.length)selectChannel(channels[0]);
}
async function selectChannel(c){channel=c;$("channelTitle").textContent="# "+c.name;$("channelDescription").textContent=c.description||"";document.querySelectorAll(".channel").forEach((b,i)=>b.classList.toggle("active",channels[i]?.id===c.id));await loadMessages()}
async function loadMembers(){
 const {data,error}=await db.from("rchat3_profiles").select("id,username").order("username").limit(80);
 if(error)return;
 profiles={};(data||[]).forEach(p=>profiles[p.id]=p.username);
 $("members").replaceChildren();
 (data||[]).forEach(p=>{const d=document.createElement("div");d.className="member"+(p.id===user.id?" me status":"");d.append(safeText("span","","dot"),document.createTextNode(p.username||"Membre"));$("members").append(d)});
}
function safeText(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function loadMessages(){
 if(!channel)return;
 const {data,error}=await db.from("rchat3_messages").select("*").eq("channel_id",channel.id).order("created_at",{ascending:true}).limit(100);
 if(error){toast("Messages : "+error.message);return}
 const box=$("messages");box.replaceChildren();if(!(data||[]).length)box.append(safeText("div","Aucun message pour l'instant. Lance la conversation !","empty"));
 (data||[]).forEach(m=>{
  const item=safeText("article","","msg"+(m.deleted_at?" deleted":""));
  item.classList.toggle("mine",m.author_id===user.id);item.append(safeText("div",(profiles[m.author_id]||"M").charAt(0).toUpperCase(),"avatar"));const head=safeText("div","","msghead");head.append(safeText("span",profiles[m.author_id]||"Membre","username"));head.append(safeText("span",new Date(m.created_at).toLocaleString("fr-FR"),"time"));item.append(head);
  item.append(safeText("div",m.deleted_at?"Message supprimé":m.content,"content"));
  if(!m.deleted_at&&m.author_id===user.id){
   const tools=safeText("div","","msgtools");
   const edit=safeText("button","Modifier","tiny");edit.onclick=()=>editMessage(m);tools.append(edit);
   const del=safeText("button","Supprimer","tiny");del.onclick=()=>deleteMessage(m);tools.append(del);item.append(tools);
  }
  box.append(item);
 });
 box.scrollTop=box.scrollHeight;
}
async function editMessage(m){const value=prompt("Modifier ton message :",m.content);if(value===null||!value.trim())return;const {error}=await db.from("rchat3_messages").update({content:value.trim(),edited_at:new Date().toISOString()}).eq("id",m.id).eq("author_id",user.id);toast(error?error.message:"Message modifié.");if(!error)loadMessages()}
async function deleteMessage(m){if(!confirm("Supprimer ce message ?"))return;const {error}=await db.from("rchat3_messages").update({deleted_at:new Date().toISOString()}).eq("id",m.id).eq("author_id",user.id);toast(error?error.message:"Message supprimé.");if(!error)loadMessages()}
$("composer").onsubmit=async e=>{e.preventDefault();const content=$("messageInput").value.trim();if(!content||!channel)return;const {error}=await db.from("rchat3_messages").insert({channel_id:channel.id,author_id:user.id,content});if(error){toast(error.message);return}$("messageInput").value=""};
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}});
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){user=null;$("app").style.display="none";$("auth").style.display="block"}});
db.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
</script>
</body></html>
